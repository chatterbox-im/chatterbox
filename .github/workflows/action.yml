name: CI

on: push
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      XMPP_SERVER: ${{ secrets.XMPP_SERVER }}
      XMPP_USERNAME: ${{ secrets.XMPP_USERNAME }}
      XMPP_PASSWORD: ${{ secrets.XMPP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build

      - name: Unit tests
        run: cargo test --lib -- --test-threads=1

      - name: Run headless (30s smoke test)
        run: ./scripts/run_headless.sh 30

      - name: Check connection
        run: ./scripts/check_connection.sh

      - name: Check OMEMO bundle published
        run: ./scripts/check_bundle_published.sh

      - name: Check OMEMO initialization
        run: ./scripts/check_omemo_init.sh

      - name: Check no unexpected errors
        run: ./scripts/check_no_errors.sh
